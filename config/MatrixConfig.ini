[RENDERING]

;on-off windowed mode
FULLSCREEN =1

;video res, 0=640x480, 1=800x600, 2=1024x768, 3=1280x1024, 4=1600x1200, 5=1920x1440, 6=2048x1536
RESOLUTION =1920x1080

PRIMARYLIGHTSONLY=0

;framerate limiter, 0=free_run, 1=monitor_refresh, 2=60Hz
FRAMERATE_BEHAVIOR =2

;multisample = anti-aliasing levels, 2 or 4 are common
MULTISAMPLE =0

;filtering textures/mips, 0=none, 1=point, 2=bilinear, 3=anisotropic
FILTERING =2
;filtersamples for further aniso control, 1=standard, 2 or 4 are common
FILTERSAMPLES =1

;force lower LODs on objects by this additional step when available, 0=none, 1=+1
LODBIAS =0

;far clip plane modifier, range 1..100..N, 100=normal
FARCLIPBIAS =100

;only create N percent of all scripted particles, range 0..100..N, 100=normal
PARTICLEDENSITY =100
;if density forces particles below this number then clamp it to N
PARTICLEMINIMUM =1

;on-off control for color ramp override
ALLOW_GAMMA =1
ALLOW_WINDOW_GAMMA =1

;color overrides, 25..500, 100=normal for all
GAMMA =130
BRIGHTNESS =130
CONTRAST =130
MAX_LOD=-1

DISPLAYSHADOWS=1
SAFEMODE=0
WBUFFER=1

;Please turn to 1 if you experience undue slowdown during Focus moves
ALTERNATEFOCUS=0

[PATHS]
;note - must have trailing \ slash
;DEFAULT_DATA=J:\.\
;PRIMARY_DATA=J:\.\

[CONTROLS]
;100=normal, 250=high speed
MOUSE_SENSITIVITY=150
;Turns off auto-targeting to make for a more challenging PC game
CLASSICAL_FPS=1
